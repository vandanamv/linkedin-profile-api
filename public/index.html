<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn Profile API</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <section class="header">
      <h1>LinkedIn Profile API</h1>
      <p class="subtitle">Enter a LinkedIn profile URL and view the structured JSON returned by the backend API.</p>
    </section>

    <section class="shell">
      <div class="panel">
        <form id="profile-form">
          <label>
            LinkedIn profile URL
            <input id="profile-url" name="url" type="url" value="https://www.linkedin.com/in/mvdsu/" placeholder="https://www.linkedin.com/in/username/" required>
          </label>
          <button id="submit-button" type="submit">Fetch JSON</button>
        </form>
        <div class="status">
          <span><strong>Endpoint</strong> POST /api/v1/profile</span>
          <span id="request-status">Ready</span>
        </div>
      </div>

      <div class="panel output">
        <div class="output-head">
          <span>Response JSON</span>
          <span id="response-meta">No request yet</span>
        </div>
        <pre><code id="output">Paste a LinkedIn URL and click Fetch JSON.</code></pre>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
