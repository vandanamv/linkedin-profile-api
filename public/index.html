<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedIn Profile API</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      background: #f4f7fb;
      color: #162033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, #e8f2ff 0, rgba(232, 242, 255, 0) 340px),
        #f4f7fb;
    }

    main {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0;
    }

    .header {
      display: grid;
      gap: 10px;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0;
      font-size: 40px;
      line-height: 1.08;
      letter-spacing: 0;
      color: #0b1f3a;
    }

    .subtitle {
      max-width: 720px;
      margin: 0;
      color: #4b5b70;
      font-size: 16px;
    }

    .shell {
      display: grid;
      gap: 16px;
    }

    .panel {
      border: 1px solid #d8e1ed;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 14px 40px rgba(15, 33, 58, 0.08);
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 16px;
    }

    label {
      display: grid;
      gap: 6px;
      min-width: 0;
      color: #34445a;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 46px;
      border: 1px solid #b9c7d9;
      border-radius: 8px;
      padding: 0 14px;
      font: inherit;
      font-size: 15px;
      color: #152238;
      background: #fff;
      outline: none;
    }

    input:focus {
      border-color: #0a66c2;
      box-shadow: 0 0 0 3px rgba(10, 102, 194, 0.16);
    }

    button {
      align-self: end;
      height: 46px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font: inherit;
      font-weight: 800;
      color: #fff;
      background: #0a66c2;
      cursor: pointer;
    }

    button:hover {
      background: #084f96;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .status {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid #e3e9f2;
      color: #526174;
      font-size: 13px;
    }

    .status strong {
      color: #142238;
    }

    .output {
      overflow: hidden;
    }

    .output-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #243142;
      color: #d9e6f7;
      background: #111a28;
      font-size: 13px;
      font-weight: 700;
    }

    pre {
      min-height: 420px;
      max-height: 68vh;
      overflow: auto;
      margin: 0;
      padding: 16px;
      background: #0d1522;
      color: #e8f0fb;
      white-space: pre-wrap;
      word-break: break-word;
    }

    code {
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
      font-size: 13px;
    }

    .error {
      color: #ffd1d1;
    }

    @media (max-width: 680px) {
      main {
        width: min(100% - 24px, 1080px);
        padding: 28px 0;
      }

      h1 {
        font-size: 30px;
      }

      form {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .status {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="header">
      <h1>LinkedIn Profile API</h1>
      <p class="subtitle">Enter a LinkedIn profile URL and view the structured JSON returned by the backend API.</p>
    </section>

    <section class="shell">
      <div class="panel">
        <form id="profile-form">
          <label>
            LinkedIn profile URL
            <input id="profile-url" name="url" type="url" value="https://www.linkedin.com/in/mvdsu/" placeholder="https://www.linkedin.com/in/username/" required>
          </label>
          <button id="submit-button" type="submit">Fetch JSON</button>
        </form>
        <div class="status">
          <span><strong>Endpoint</strong> POST /api/v1/profile</span>
          <span id="request-status">Ready</span>
        </div>
      </div>

      <div class="panel output">
        <div class="output-head">
          <span>Response JSON</span>
          <span id="response-meta">No request yet</span>
        </div>
        <pre><code id="output">Paste a LinkedIn URL and click Fetch JSON.</code></pre>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('profile-form');
    const input = document.getElementById('profile-url');
    const output = document.getElementById('output');
    const button = document.getElementById('submit-button');
    const requestStatus = document.getElementById('request-status');
    const responseMeta = document.getElementById('response-meta');

    function renderJson(value, isError = false) {
      output.className = isError ? 'error' : '';
      output.textContent = JSON.stringify(value, null, 2);
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      button.disabled = true;
      requestStatus.textContent = 'Fetching profile...';
      responseMeta.textContent = 'Loading';
      output.className = '';
      output.textContent = 'Loading...';

      const startedAt = performance.now();

      try {
        const response = await fetch('/api/v1/profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: input.value.trim() })
        });
        const data = await response.json();
        const elapsedMs = Math.round(performance.now() - startedAt);

        requestStatus.textContent = response.ok ? 'Success' : 'Request failed';
        responseMeta.textContent = `${response.status} in ${elapsedMs}ms`;
        renderJson(data, !response.ok);
      } catch (error) {
        requestStatus.textContent = 'Network error';
        responseMeta.textContent = 'Failed';
        renderJson({ status: 'error', message: error.message }, true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
